<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Self-RAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>
    // set the theme before first paint to avoid a flash
    (function () { try { var t = localStorage.getItem("sr.theme");
      var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light"; } catch (e) {} })();
  </script>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <a class="logo-mark" href="#/ask" aria-label="Self-RAG home">SR</a>
    <a class="nav-item" data-nav="ask" href="#/ask"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Ask</a>
    <a class="nav-item" data-nav="chat" href="#/chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4zM8 9h8M8 12h5"/></svg>Chat</a>
    <a class="nav-item" data-nav="library" href="#/library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h5v16H4zM11 4h5v16h-5zM18 6l3 .8-3.6 13.2-3-.8z"/></svg>Library</a>
    <a class="nav-item" data-nav="lab" href="#/lab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6l-5.5 9.5A1.5 1.5 0 0 0 5.8 21h12.4a1.5 1.5 0 0 0 1.3-2.5L14 9V3"/><path d="M7.5 15h9"/></svg>Lab</a>
    <a class="nav-item" data-nav="insights" href="#/insights"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-8"/></svg>Insights</a>
    <a class="nav-item" data-nav="architecture" href="#/architecture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5zM3 13l9 5 9-5M3 17.5 12 22l9-4.5"/></svg>Design</a>
    <div class="rail-foot"><button class="btn ghost icon" id="theme-btn" aria-label="Switch theme"></button></div>
  </nav>
  <div class="main">
    <header class="topbar">
      <h1 id="page-title">Ask</h1>
      <span class="right"></span>
      <span class="pill" id="status-pill"><span class="dot"></span>Connecting…</span>
    </header>
    <main>
      <div class="view" id="view-ask" hidden></div>
      <div class="view" id="view-chat" hidden></div>
      <div class="view" id="view-library" hidden></div>
      <div class="view" id="view-lab" hidden></div>
      <div class="view" id="view-insights" hidden></div>
      <div class="view" id="view-architecture" hidden></div>
    </main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px">Self-RAG needs JavaScript.</p></noscript>
<script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
